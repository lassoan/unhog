name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags are needed for git describe

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build Unhog.exe
        run: python build_exe.py
        env:
          # On a tag build the version is the tag itself; otherwise git describe decides.
          UNHOG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Unhog
          path: |
            dist/Unhog.zip
            dist/Unhog.exe

      - name: Attach zip and exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Unhog.zip dist/Unhog.exe \
            --title "Unhog $GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" dist/Unhog.zip dist/Unhog.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Publishes the sdist and wheel to PyPI on tag builds, after the exe build
  # and tests above succeed. Uses PyPI trusted publishing (no API token): the
  # project on PyPI must list this repository, workflow file and environment
  # name as a publisher, see DEVELOPMENT.md.
  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
