name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags are needed for git describe

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build Unhog.exe
        run: python build_exe.py
        env:
          # On a tag build the version is the tag itself; otherwise git describe decides.
          UNHOG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unhog
          path: dist/Unhog.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Unhog.exe \
            --title "Unhog $GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" dist/Unhog.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
